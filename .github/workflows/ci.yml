name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.affected.outputs.filter }}
      e2e: ${{ steps.affected.outputs.e2e }}
      visual: ${{ steps.affected.outputs.visual }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: github.event_name == 'pull_request'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        if: github.event_name == 'pull_request'
        run: bun install --frozen-lockfile

      - name: Find the packages and test suites the change affects
        id: affected
        if: github.event_name == 'pull_request'
        run: |
          filter='--filter=...[origin/main]'
          echo "filter=$filter" >> "$GITHUB_OUTPUT"

          theme_demo=$(bunx turbo ls "$filter" --output=json | jq '.packages.items | any(.name == "@apps/theme-demo")')
          e2e=false
          visual=false
          if [ "$theme_demo" = true ]; then
            git diff --quiet --no-renames HEAD^1 HEAD -- ':!*.md' ':!*.png' || e2e=true
            git diff --quiet --no-renames HEAD^1 HEAD -- ':!*.md' || visual=true
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      AFFECTED_FILTER: ${{ needs.changes.outputs.filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build $AFFECTED_FILTER

      - name: Unit tests
        run: bun run test $AFFECTED_FILTER

      - name: Type-check
        run: bun run typecheck $AFFECTED_FILTER

  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/theme-demo^...

      - name: End-to-end tests
        run: bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/theme-demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/theme-demo/test-results

  visual:
    name: visual (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.visual != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Bun
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/theme-demo^...

      - name: Visual regression tests
        run: bun run test:visual --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/theme-demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Upload the differing screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences-${{ matrix.shard }}
          path: apps/theme-demo/test-results

  validate:
    if: always()
    needs: [changes, build-and-test, e2e, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
