name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      filter: ${{ steps.affected.outputs.filter }}
      theme_demo_e2e: ${{ steps.affected.outputs.theme_demo_e2e }}
      theme_demo_visual: ${{ steps.affected.outputs.theme_demo_visual }}
      path_demo_e2e: ${{ steps.affected.outputs.path_demo_e2e }}
      redirects_demo_e2e: ${{ steps.affected.outputs.redirects_demo_e2e }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup

      - name: Find the packages and test suites the change affects
        id: affected
        if: github.event_name == 'pull_request'
        run: |
          echo "filter=--filter=...[origin/main]" >> "$GITHUB_OUTPUT"
          scripts/demo-tests.sh @apps/theme-demo >> "$GITHUB_OUTPUT"
          scripts/demo-tests.sh @apps/path-demo >> "$GITHUB_OUTPUT"
          scripts/demo-tests.sh @apps/redirects-demo >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      AFFECTED_FILTER: ${{ needs.changes.outputs.filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the formatting
        run: bun run format:check

      - name: Check that the Playwright image matches the demos' Playwright
        run: |
          expected=$(jq -r '.devDependencies["@playwright/test"] // empty' apps/*/package.json | sort -u)
          found=$(grep -rhoE 'mcr\.microsoft\.com/playwright:v[^-[:space:]]+' .github/workflows | sed 's/.*:v//' | sort -u)
          if [[ "$expected" != "$found" ]]; then
            echo "::error::The demos use @playwright/test ${expected//$'\n'/, } and the workflows the Playwright image ${found//$'\n'/, }. Use one version in both."
            exit 1
          fi

      # The path and redirects packages' tests start a MongoDB replica set, which downloads its binary once.
      - name: Keep the MongoDB binary in the workspace
        run: echo "MONGOMS_DOWNLOAD_DIR=$GITHUB_WORKSPACE/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('bun.lock') }}
          restore-keys: mongodb-binaries-

      - name: Build
        run: bun run build ${AFFECTED_FILTER:+"$AFFECTED_FILTER"}

      - name: Tests
        run: bun run test ${AFFECTED_FILTER:+"$AFFECTED_FILTER"}

      - name: Type-check
        run: bun run typecheck ${AFFECTED_FILTER:+"$AFFECTED_FILTER"}

  theme-e2e:
    name: theme-e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.theme_demo_e2e != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/theme-demo^...

      - name: End-to-end tests
        run: bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/theme-demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-e2e-traces-${{ matrix.shard }}
          path: apps/theme-demo/test-results

  theme-visual:
    name: theme-visual (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.theme_demo_visual != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/theme-demo^...

      - name: Visual regression tests
        run: bun run test:visual --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: apps/theme-demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Upload the differing screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-differences-${{ matrix.shard }}
          path: apps/theme-demo/test-results

  path-e2e:
    needs: changes
    if: needs.changes.outputs.path_demo_e2e != 'false'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # The demo starts a MongoDB replica set, which downloads its binary once.
      - name: Keep the MongoDB binary in the workspace
        run: echo "MONGOMS_DOWNLOAD_DIR=$GITHUB_WORKSPACE/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('bun.lock') }}
          restore-keys: mongodb-binaries-

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/path-demo^...

      - name: End-to-end tests
        run: bun run test:e2e
        working-directory: apps/path-demo

      - name: Check that the generated types and import map are current
        run: |
          bun run generate
          # The container runs as another user than the one that checked out, and git then takes the
          # workspace for no repository and compares the two files with each other.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- src/payload-types.ts "src/app/(payload)/admin/importMap.js"
        working-directory: apps/path-demo

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: path-e2e-traces
          path: apps/path-demo/test-results

  redirects-e2e:
    needs: changes
    if: needs.changes.outputs.redirects_demo_e2e != 'false'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # The demo starts a MongoDB replica set, which downloads its binary once.
      - name: Keep the MongoDB binary in the workspace
        run: echo "MONGOMS_DOWNLOAD_DIR=$GITHUB_WORKSPACE/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('bun.lock') }}
          restore-keys: mongodb-binaries-

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/redirects-demo^...

      - name: End-to-end tests
        run: bun run test:e2e
        working-directory: apps/redirects-demo

      - name: Check that the generated types and import map are current
        run: |
          bun run generate
          # The container runs as another user than the one that checked out, and git then takes the
          # workspace for no repository and compares the two files with each other.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- src/payload-types.ts "src/app/(payload)/admin/importMap.js"
        working-directory: apps/redirects-demo

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redirects-e2e-traces
          path: apps/redirects-demo/test-results

  validate:
    if: always()
    needs: [changes, build-and-test, theme-e2e, theme-visual, path-e2e, redirects-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
