name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/assets/**'
      - '.github/workflows/docs.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payloadpack-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build docs
        run: bun run build
        working-directory: apps/docs

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
