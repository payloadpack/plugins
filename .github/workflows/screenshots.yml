name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'apps/theme-demo/**'
      - 'packages/theme/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

concurrency:
  group: payloadpack-screenshots
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.demo.outputs.theme_demo_visual }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check whether the change can alter the screenshots
        id: demo
        env:
          BASE: ${{ github.event.before }}
        run: scripts/demo-tests.sh @apps/theme-demo "$BASE" >> "$GITHUB_OUTPUT"

  screenshots:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the packages the demo uses
        run: bun run build --filter=@apps/theme-demo^...

      - name: Install Playwright browser
        run: bunx playwright install chromium
        working-directory: apps/theme-demo

      - name: Take screenshots
        run: bun run screenshots
        working-directory: apps/theme-demo
        env:
          PAYLOAD_SECRET: ci-only-secret

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAYLOADPACK_RELEASE_BOT_TOKEN }}
          add-paths: .github/assets
          branch: chore/screenshots
          delete-branch: true
          commit-message: 'docs: refresh screenshots'
          title: 'docs: refresh screenshots'
          body: The Screenshots workflow found visual changes in the screenshots.
