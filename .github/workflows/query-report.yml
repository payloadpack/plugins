name: Query report

on:
  pull_request:
    paths:
      - 'packages/path/**'
      - 'packages/redirects/**'
      - 'scripts/query-report/**'
      - '.github/workflows/query-report.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: query-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# It reports and never fails the pull request: a package's run that stops says so in the comment.
jobs:
  query-report:
    # A fork's pull request gets a token that can't comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      # The merge commit and its parents: the pull request's base is the first.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      # The packages' reports start a MongoDB replica set, which downloads its binary once.
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('bun.lock') }}
          restore-keys: mongodb-binaries-
      # Redirects' report runs path from its build, as its tests do.
      - run: bun run build --filter='@payloadpack/redirects^...'
      # Only the packages the pull request changes. A change to the report itself measures both.
      - name: Measure the changed packages
        run: |
          export QUERY_REPORT_BASE=$(git rev-parse HEAD^1)
          changed=$(git diff --name-only "$QUERY_REPORT_BASE" HEAD)
          reports=()
          for name in path redirects; do
            grep -qE "^(packages/$name/|scripts/query-report/|\.github/workflows/query-report\.yml)" <<< "$changed" || continue
            (cd "packages/$name" && QUERY_REPORT_OUTPUT="$RUNNER_TEMP/query-report/$name.json" bunx vitest run --config ../../scripts/query-report/vitest.config.ts) || true
            reports+=("$RUNNER_TEMP/query-report/$name.json")
          done
          bun scripts/query-report/report.ts "${reports[@]}" > "$RUNNER_TEMP/query-report.md"
      # One comment per pull request: each run replaces the one with this header.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: query-report
          path: ${{ runner.temp }}/query-report.md
