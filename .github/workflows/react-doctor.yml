name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/theme-demo/**'
      - 'packages/theme/**'
      - '.github/workflows/react-doctor.yml'
  push:
    branches: [main]
    paths:
      - 'apps/theme-demo/**'
      - 'packages/theme/**'
      - '.github/workflows/react-doctor.yml'

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Check whether the change reaches the demo's code
        id: demo
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}
        run: scripts/demo-tests.sh @apps/theme-demo "$BASE" >> "$GITHUB_OUTPUT"

      - name: React Doctor
        if: steps.demo.outputs.e2e == 'true'
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
