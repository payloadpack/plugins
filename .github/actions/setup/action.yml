name: Setup
description: Installs Node from .nvmrc, Bun from the packageManager field in package.json and the dependencies from the lockfile.

inputs:
  registry-url:
    description: The npm registry a publishing job authenticates to.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        registry-url: ${{ inputs.registry-url }}

    # setup-bun unpacks Bun with unzip, which the Playwright image lacks, and installing unzip would
    # bring apt-get back into the container jobs. Without unzip, Bun comes from npm instead.
    - name: Find how to install Bun
      id: bun
      shell: bash
      run: |
        if command -v unzip >/dev/null; then
          echo "installer=setup-bun" >> "$GITHUB_OUTPUT"
        else
          echo "installer=npm" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      if: steps.bun.outputs.installer == 'setup-bun'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install Bun from npm
      if: steps.bun.outputs.installer == 'npm'
      shell: bash
      run: npm install --global "$(node -p "require('./package.json').packageManager")"

    - name: Install dependencies (frozen lockfile)
      shell: bash
      run: bun install --frozen-lockfile
